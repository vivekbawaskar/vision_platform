# Optional: run MySQL in Docker instead of XAMPP.
#   docker compose up -d
# Then set DB_HOST=127.0.0.1 and DB_PASSWORD in .env to match below.
services:
  mysql:
    image: mysql:8.0
    container_name: vision_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: vision_platform
    ports:
      - "3306:3306"
    volumes:
      - vision_mysql_data:/var/lib/mysql
      - ./database_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vision_mysql_data:
